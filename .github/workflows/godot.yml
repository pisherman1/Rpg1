name: Godot build

on:
  push:
    paths:
      - "godot/**"
      - ".github/workflows/godot.yml"
  workflow_dispatch:

env:
  GODOT_VERSION: 4.5.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot-bin
          chmod +x godot-bin

      - name: Import project
        run: ./godot-bin --headless --path godot --import

      - name: Check scripts
        run: |
          status=0
          for f in $(cd godot && find scripts tests -name '*.gd' | sort); do
            out=$(./godot-bin --headless --path godot --check-only --script "res://$f" 2>&1) || { status=1; echo "== $f"; echo "$out" | grep -v '^Godot Engine' | head -20; }
          done
          exit $status

      - name: Run tests
        run: |
          set -o pipefail
          ./godot-bin --headless --path godot --script res://tests/run_tests.gd 2>&1 | tee test.log && ! grep -q "SCRIPT ERROR" test.log || {
            echo "::group::Distinct errors"
            grep -E "ERROR|at: " test.log | sed 's/^ *//' | sort | uniq -c | sort -rn | head -60
            echo "::endgroup::"
            grep -E "^(PASS|FAIL) " test.log
            exit 1
          }

      - name: Cache export templates
        id: templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Download export templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q templates.tpz -d ~/.local/share/godot/export_templates
          mv ~/.local/share/godot/export_templates/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Export Android APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/app/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p ~/.config/godot godot/build
          cat > ~/.config/godot/editor_settings-4.5.tres <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${GODOT_ANDROID_KEYSTORE_DEBUG_PATH}"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          ./godot-bin --headless --verbose --path godot --export-debug "Android" build/dungeon-delver-2.apk
          ls -la godot/build

      - uses: actions/upload-artifact@v4
        with:
          name: dungeon-delver-2-apk
          path: godot/build/dungeon-delver-2.apk
          if-no-files-found: error
